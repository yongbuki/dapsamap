<style>
/* Layout: full-bleed 3D plan with a slim sheet header; records open in a side sheet (desktop) or bottom sheet (phone).
   Same tokens and poché symbols as the Claude 답사 지도, so the two read as one system. */
:root{
  --paper:#EDEFEA; --sheet:#FAFAF8; --land:#DFE3DA; --bldg:#D5D9CF; --ink:#1C2120; --ink-2:#56605C; --ink-3:#8A938F;
  --line:#C4CAC2; --hair:#D9DDD5; --accent:#2C47C4; --accent-ink:#FFFFFF; --accent-soft:rgba(44,71,196,.11); --danger:#B8342C;
  --c-arch:#CF4237; --c-public:#13838A; --c-park:#3A8749; --c-street:#BC820C; --c-interior:#8350B0; --c-etc:#6C7671;
  --shadow:0 1px 2px rgba(20,24,23,.08),0 10px 30px rgba(20,24,23,.14);
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --hs-shadow:#5B6560; --hs-light:#FFFFFF; --contour:#7A4E1C; --adm:#4F5A9E; --parcel:#A0522D; --site:#C23B22; --env:#D9962B;
  --draw:#5F3DC4; --imp:#1971C2; --meas:#C2255C;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121615; --sheet:#1A1F1E; --land:#1E2523; --bldg:#323B38; --ink:#E5E9E6; --ink-2:#A0A9A5; --ink-3:#6E7874;
  --line:#343D3A; --hair:#29312F; --accent:#8D9BFF; --accent-ink:#0F1330; --accent-soft:rgba(141,155,255,.16); --danger:#FF7B71;
  --c-arch:#FF6E61; --c-public:#3DC2C8; --c-park:#6CC47D; --c-street:#E7B23B; --c-interior:#B98BE7; --c-etc:#9BA59F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45); --hs-shadow:#000000; --hs-light:#4A5552; --contour:#E0B676; --adm:#A9B2F0; --parcel:#E8A07A; --site:#FF7A5C; --env:#F2C14E; --draw:#B197FC; --imp:#74C0FC; --meas:#FF6B9A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

.bar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px 16px;background:var(--sheet);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand h1{margin:0;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap}
.brand p{margin:0;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand > div{min-width:0}
.ib{border:1px solid var(--line);background:var(--sheet);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{border-color:var(--ink-3)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--paper)}
.maplibregl-ctrl-group{background:var(--sheet)!important;border:1px solid var(--line);box-shadow:var(--shadow)!important;border-radius:10px!important}
.maplibregl-ctrl-group button{width:38px!important;height:36px!important}
.maplibregl-ctrl-group button + button{border-top:1px solid var(--hair)!important}
@media (prefers-color-scheme: dark){.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}}
.maplibregl-ctrl-attrib{font-size:10px;background:color-mix(in srgb,var(--sheet) 85%,transparent)!important;color:var(--ink-2)}
.maplibregl-ctrl-attrib a{color:var(--ink-2)}
.tools{position:absolute;right:10px;top:132px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet);box-shadow:var(--shadow);z-index:2}
.tools button{border:0;background:none;width:38px;height:38px;display:grid;place-items:center;color:var(--ink);font:600 11px var(--f-mono)}
.tools button + button{border-top:1px solid var(--hair)}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.zhint{position:absolute;left:50%;top:118px;transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2);white-space:nowrap;box-shadow:var(--shadow);z-index:2;pointer-events:none}
.crumb{position:absolute;left:12px;top:12px;max-width:calc(100% - 76px);display:flex;align-items:center;gap:2px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;font-size:12.5px;box-shadow:var(--shadow);z-index:2;white-space:nowrap;overflow:hidden}
.cint{position:absolute;left:12px;top:50px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:500 11px var(--f-mono);color:var(--ink-2);box-shadow:var(--shadow);z-index:2;display:flex;align-items:center;gap:6px;pointer-events:none}
.cint i{display:inline-block;width:16px;height:0;border-top:2px solid var(--contour)}
.cint i.mn{border-top-width:1px}
.crumb svg{flex:none;margin-right:5px;color:var(--adm)}
.crumb span{overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--ink-3);margin:0 3px;flex:none}
.crumb .lv1{color:var(--ink-2)}.crumb .lv2{color:var(--ink-2)}.crumb .lv3{font-weight:700;color:var(--ink)}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin:2px 0 8px}
.seg button{flex:1;border:0;background:none;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.zone{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.zone header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.zone h3{margin:0;font-size:15px;font-weight:700;flex:1}
.zone h3 small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--ink-3);margin-left:6px}
.dong{display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:6px 10px;align-items:start;padding:7px 0;border-top:1px dashed var(--hair)}
.dong .dn{font-size:12px;font-weight:600;color:var(--adm);padding-top:4px}
.dong .rs{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.dong .rs button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 10px 3px 7px;font-size:12.5px;max-width:100%}
.dong .rs button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vwbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;margin-bottom:14px}
.vwbox h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.vwbox h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.vwbox h3 .dot.ok{background:var(--c-park)}.vwbox h3 .dot.bad{background:var(--danger)}
.vwrow{display:flex;gap:6px}
.vwrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font:13px var(--f-mono)}
.vwopts{display:grid;gap:6px}
.vwopts label{display:flex;align-items:center;gap:8px;font-size:13px}
.vwopts input{width:16px;height:16px;accent-color:var(--accent)}
.zpill{position:absolute;left:12px;top:84px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink-2);box-shadow:var(--shadow);z-index:2;display:flex;align-items:center;gap:6px;pointer-events:none;max-width:calc(100% - 76px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zpill i{width:10px;height:10px;border-radius:2px;flex:none}
.projrow{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.projrow label{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.projrow select{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 8px;font-size:13px}
.projnew{display:flex;gap:6px;margin:-2px 0 10px}.projnew input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:13px}
.sitelist{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.sitechip{flex:none;display:grid;gap:1px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;min-width:140px;max-width:220px}
.sitechip b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sitechip span{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitechip[aria-pressed="true"]{border-color:var(--site);box-shadow:inset 0 0 0 1px var(--site)}
.sitechip.add{border-style:dashed}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px}
.cardhead{display:flex;gap:6px;align-items:center;margin-bottom:4px}.cardhead input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);background:none;font-size:17px;font-weight:700;padding:4px 0}
.spec.tight{margin:8px 0}.spec.tight dt,.spec.tight dd{padding:5px 0}.spec.tight dt{min-width:58px}
.spec b.ok{color:var(--c-park)}.spec b.over{color:var(--danger)}
.zsw,.msw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0 2px}.tgl input{width:16px;height:16px;accent-color:var(--env)}
.mass{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 0;border-top:1px dashed var(--hair)}
.mass input[type=text]{width:84px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 6px;font-size:12.5px}
.mass .mm{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stp button{border:0;background:none;width:28px;height:26px;font-size:14px;color:var(--ink)}.stp b{font-size:12px;padding:0 4px;min-width:42px;text-align:center;font-weight:600}
.stp.big button{width:36px;height:32px}.stp.big{margin-top:6px}
.fh{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2)}.fh input{width:52px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 5px;font-size:12px}
.x.sm{width:26px;height:26px;font-size:16px}
.numin{width:60px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;font-size:13px}
.menu-list.row{display:flex;flex-wrap:wrap;gap:6px}
.warn{margin:6px 0 0;font-size:12.5px;color:var(--danger)}
.sunrow{display:flex;align-items:center;gap:10px;margin:4px 0}.sunrow input{flex:1;accent-color:var(--env)}.sunrow b{font-family:var(--f-mono);font-size:13px;min-width:44px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin:8px 0 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-2px}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 4px}.rtab th,.rtab td{border-bottom:1px solid var(--hair);padding:5px 4px;text-align:left;vertical-align:top}
.rtab th{font-weight:600;color:var(--ink-2);font-size:11.5px}.rtab th small{font-weight:400;color:var(--ink-3)}.rtab td:nth-child(2),.rtab td:nth-child(3){font-family:var(--f-mono);text-align:center}
.rtab i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.secwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:4px 0 8px}.secwrap svg{display:block;width:100%;height:auto;min-width:400px}
.addmenu{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;display:grid;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);width:min(300px,calc(100% - 32px))}
.addmenu button{display:grid;gap:1px;text-align:left;border:0;background:none;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--ink)}
.addmenu button:hover{background:var(--paper)}.addmenu button span{font-size:12px;font-weight:400;color:var(--ink-2)}
.mk.obs{width:auto;height:auto}
.mk .ob{display:block;width:14px;height:14px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.3);margin:5px}
.mk.obs .mk-l{left:22px;font-weight:500}
body.fgmode .mk{display:none}
.offline{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:360px;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);z-index:3}
.offline h3{margin:0 0 6px;font-size:15px}.offline p{margin:0;color:var(--ink-2);font-size:13px}

/* markers */
.mk{position:relative;width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer;display:block}
.mk svg{display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}

.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}

.btn.sm{padding:5px 10px;font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--ink);color:var(--sheet);padding:13px 18px;font-weight:600;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}

.placebar .row .btn.pri{flex:1}
.placebar .seg{margin:0}
.numrow{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.numrow label,.objctl label,.objctl>span{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.numrow input[type=number],.numrow select,.objctl input[type=number],.objctl select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:5px 6px;font:13px var(--f-mono)}
.numrow input[type=number]{width:78px}.objctl input[type=number]{width:70px}
.numrow select,.objctl select{font-family:var(--f-sans);font-size:12px;padding:5px 3px}
.numrow input[type=checkbox],.objctl input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
.objctl{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.objctl input[type=range]{flex:1;min-width:110px;accent-color:var(--accent)}
.objctl .btn.sm{padding:4px 8px;font-family:var(--f-mono)}
.objctl b{font:500 12px var(--f-mono);color:var(--ink);min-width:42px;text-align:right}
#objbar{max-height:58vh;overflow:auto}
.objrot{display:grid;gap:6px}
.obj{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 0;border-top:1px dashed var(--hair)}
.obj.off{opacity:.55}
.obj .ok{font:600 10.5px var(--f-mono);color:var(--sheet);background:var(--draw);border-radius:4px;padding:2px 6px}
.obj .ok.k-dxf{background:var(--imp)}.obj .ok.k-image{background:var(--ink-3)}.obj .ok.k-model{background:var(--accent);color:var(--accent-ink)}
.obj input[type=text]{flex:1;min-width:90px;max-width:200px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 6px;font-size:12.5px}
.obj .mm{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);flex-basis:100%}
.obj .ob{display:flex;gap:6px;flex-wrap:wrap}

/* sheets */
.panel{position:fixed;z-index:8;background:var(--sheet);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.panel .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 22px;flex:1;min-height:0}
@media (min-width:900px){.panel{top:calc(64px + env(safe-area-inset-top,0px));right:12px;bottom:12px;width:400px;border:1px solid var(--line);border-radius:14px}.grab{display:none}}

  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}}

.p-head{display:flex;align-items:center;gap:8px;padding:10px 14px 6px 18px}
.p-kicker{flex:1;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);min-width:0}
.x{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-size:22px;line-height:1}
.x:hover{background:var(--paper)}
.p-title{font-size:21px;line-height:1.25;margin:4px 0 2px;letter-spacing:-.01em;text-wrap:balance}
.p-sub{margin:0;color:var(--ink-2);font-size:13px}
.ph-strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px 0 10px}
.ph-strip img{height:200px;width:auto;max-width:none;border-radius:8px;scroll-snap-align:start;background:var(--land);cursor:zoom-in;flex:none}
.ph-strip img:only-child{width:100%;object-fit:cover}
.stars{color:var(--c-street);letter-spacing:2px;font-size:15px;margin:8px 0 2px}.stars .off{color:var(--line)}
.spec{display:grid;grid-template-columns:auto 1fr;margin:14px 0;border-top:1px solid var(--ink)}
.spec dt,.spec dd{margin:0;padding:7px 0;border-bottom:1px solid var(--hair)}
.spec dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;padding-right:14px;padding-top:9px;white-space:nowrap}
.spec dd{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.memo{white-space:pre-wrap;font-size:14px;line-height:1.65;margin:12px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--hair);color:var(--ink-2)}
.coords{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin:12px 0 6px;font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:6px}
.sameday{margin:16px 0 4px;padding:10px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--paper)}
.sameday .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.sameday ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center}
.sameday li{display:flex;align-items:center}
.sameday li + li::before{content:"→";color:var(--ink-3);margin:0 4px}
.sameday button{border:0;background:none;padding:2px 4px;border-radius:4px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.sameday button[aria-current="true"]{font-weight:700;background:var(--accent-soft)}
.p-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.confirm{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1;min-width:180px}

.form{display:grid;gap:14px;padding-top:4px}
.fld{display:grid;gap:5px;min-width:0}
.fld > label,.fld > .lab{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld input[type=search],.fld textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px}
.fld textarea{min-height:96px;resize:vertical;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namebox{display:flex;gap:6px}.namebox input{flex:1;min-width:0}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 10px 5px 8px;font-size:12.5px}
.cats button[aria-pressed="true"]{border-color:var(--ink);background:var(--paper);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink)}
.locbox{border:1px dashed var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}

.locnow.none{color:var(--ink-3);font-family:var(--f-sans)}
.locsrc{font-family:var(--f-sans);font-size:11.5px;color:var(--ink-2);margin-left:6px}
.locbtns{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--ink-3);margin:0;text-wrap:pretty}
.section-t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;border-top:1px solid var(--ink);padding-top:8px;margin-top:4px}
.rate{display:flex;gap:2px}
.rate button{border:0;background:none;font-size:22px;color:var(--line);padding:0 2px;line-height:1}
.rate button.on{color:var(--c-street)}
.phedit{display:flex;gap:8px;flex-wrap:wrap}
.phedit .th{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;background:var(--land)}
.phedit .th img{width:100%;height:100%;object-fit:cover}
.phedit .th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
.phedit label.add{width:76px;height:76px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-size:12px;text-align:center;cursor:pointer;line-height:1.3}
.phedit .busy{width:76px;height:76px;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
.err{color:var(--danger);font-size:12.5px;margin:0}
.formbar{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--hair);background:var(--sheet)}
.formbar .btn.pri{flex:1}

/* search & list & menu */
.res{display:grid;gap:6px;margin-top:10px}
.res button{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 11px;display:grid;gap:1px}
.res b{font-size:13.5px;font-weight:600}
.res span{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.month h2{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;font-weight:500;color:var(--ink-2);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.day{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;margin-bottom:10px}
.day header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.day time{font-family:var(--f-mono);font-size:14px;font-weight:500}
.day .meta{color:var(--ink-2);font-size:12px;flex:1}
.linewrap{overflow-x:auto;margin-top:10px;padding-bottom:4px}
.stops{list-style:none;margin:0;padding:0;display:flex;min-width:min-content}
.stops li{position:relative;flex:none;width:118px}
.stops li::before{content:"";position:absolute;left:0;right:0;top:15px;height:3px;background:var(--ink);opacity:.8}
.stops li:first-child::before{left:50%}.stops li:last-child::before{right:50%}.stops li:only-child::before{display:none}
.stops button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;border:0;background:none;padding:2px 6px;text-align:center}
.stops .node{width:32px;height:32px;display:grid;place-items:center;background:var(--sheet);border-radius:50%}
.stops .nm{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stops .sm{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.menu-list{display:grid;gap:8px;margin-top:6px}
.menu-list .btn{justify-content:flex-start;padding:10px 12px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px}
.chip[aria-pressed="false"]{opacity:.42}

body.placing .toast{bottom:auto;top:calc(66px + env(safe-area-inset-top,0px))}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,12,12,.94);display:grid;place-items:center}
.lb img{max-width:calc(100% - 24px);max-height:calc(100% - 96px);object-fit:contain}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;color:#fff}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:28px;border:0;background:rgba(255,255,255,.1);width:44px;height:44px;border-radius:50%}
.lb .prev{left:12px}.lb .next{right:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<script>
(() => {
'use strict';
/* ---------------- constants & helpers ---------------- */
const CATS = [
  {id:'arch', name:'건축물', shape:'square'}, {id:'public', name:'광장·공공공간', shape:'circle'},
  {id:'park', name:'공원·조경', shape:'triangle'}, {id:'street', name:'거리·동네', shape:'diamond'},
  {id:'interior', name:'실내·인테리어', shape:'squareO'}, {id:'etc', name:'기타', shape:'circleO'},
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const WD = ['일','월','화','수','목','금','토'];
const R = 6371008.8, D2R = Math.PI/180;
const GA = 6378137, GE2 = 0.00669438002290; // GRS80 ellipsoid (same as EPSG:5186/5187)
function radii(lat){ const s = Math.sin(lat*D2R), w = 1 - GE2*s*s; return {M: GA*(1 - GE2)/(w*Math.sqrt(w)), N: GA/Math.sqrt(w)}; }
const BUSAN = [129.06, 35.16];
const STYLE_LIGHT = 'https://tiles.openfreemap.org/styles/positron';
const STYLE_DARK = 'https://tiles.openfreemap.org/styles/dark';
const SAT_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const NOMI = 'https://nominatim.openstreetmap.org';
const DEM_URL = 'https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png';

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dParts = s => { const [y,m,d] = String(s||'').split('-').map(Number); return {y,m,d}; };
const dayLabel = s => { if(!s) return '날짜 없음'; const {y,m,d} = dParts(s); return `${y}.${pad(m)}.${pad(d)} ${WD[new Date(y,m-1,d).getDay()]}`; };
const shortDay = s => { if(!s) return '—'; const {y,m,d} = dParts(s); return `${pad(m)}.${pad(d)} ${WD[new Date(y,m-1,d).getDay()]}`; };
const hasLoc = r => r && Number.isFinite(r.lat) && Number.isFinite(r.lng);
const fmtCoord = (lat,lng) => `${Math.abs(lat).toFixed(5)}° ${lat>=0?'N':'S'}, ${Math.abs(lng).toFixed(5)}° ${lng>=0?'E':'W'}`;
const hav = (a, b) => { const la = (a.lat + b.lat)/2, rr = radii(la), dx = (b.lng - a.lng)*D2R*rr.N*Math.cos(la*D2R), dy = (b.lat - a.lat)*D2R*rr.M, d = Math.hypot(dx, dy); if(d < 20000) return d; // ellipsoidal local frame: cm-level over a site
  const p1=a.lat*D2R, p2=b.lat*D2R, dp=p2-p1, dl=(b.lng-a.lng)*D2R; const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const normName = s => String(s||'').replace(/\s+/g,'').toLowerCase();
const regionKey = r => (String(r.region||'').trim().split(/\s+/)[0]) || '지역 미정';
const newId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function sortVisit(a, b){ return (a.date||'').localeCompare(b.date||'') || (a.time||'99:99').localeCompare(b.time||'99:99') || ((a.createdAt||0)-(b.createdAt||0)); }
function byDay(list){ const m = new Map(); for(const r of [...list].sort(sortVisit)){ const k = r.date||''; if(!m.has(k)) m.set(k, []); m.get(k).push(r); } return m; }
function symPath(shape, r){
  switch(shape){
    case 'square': case 'squareO': return `M${-r},${-r}h${2*r}v${2*r}h${-2*r}Z`;
    case 'circle': case 'circleO': { const q=r*1.12; return `M${-q},0a${q},${q} 0 1,0 ${2*q},0a${q},${q} 0 1,0 ${-2*q},0Z`; }
    case 'triangle': return `M0,${-r*1.35}L${r*1.25},${r*0.9}L${-r*1.25},${r*0.9}Z`;
    case 'diamond': { const q=r*1.38; return `M0,${-q}L${q},0L0,${q}L${-q},0Z`; }
  }
  return '';
}
function symSVG(cat, r=6){ const c = CAT[cat] || CAT.etc; const hollow = c.shape.endsWith('O'); return `<path d="${symPath(c.shape, r)}" fill="${hollow ? 'var(--sheet)' : `var(--c-${c.id})`}" stroke="var(--c-${c.id})" stroke-width="${hollow ? 2.2 : 1}"/>`; }
const symIcon = (cat, size=14) => `<svg width="${size}" height="${size}" viewBox="-8 -8 16 16" aria-hidden="true">${symSVG(cat, 5.2)}</svg>`;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let toastT;
function toast(msg, ms=3200){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
function stars(n){ n = n||0; return `<span aria-label="별점 ${n}점">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`; }

/* ---------------- storage (IndexedDB) ---------------- */
const DB = {
  db: null, mem: {recs: new Map(), photos: new Map(), sites: new Map()},
  open(){ return new Promise((res) => {
    try {
      const r = indexedDB.open('dapsa-map-3d', 2);
      r.onupgradeneeded = () => { const d = r.result; if(!d.objectStoreNames.contains('recs')) d.createObjectStore('recs', {keyPath:'id'}); if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); if(!d.objectStoreNames.contains('sites')) d.createObjectStore('sites', {keyPath:'id'}); };
      r.onsuccess = () => { DB.db = r.result; res(true); };
      r.onerror = () => res(false);
    } catch(_){ res(false); }
  }); },
  req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  st(name, mode='readonly'){ return DB.db.transaction(name, mode).objectStore(name); },
  async allRecs(){ return DB.db ? DB.req(DB.st('recs').getAll()) : [...DB.mem.recs.values()]; },
  async putRec(r){ if(DB.db) return DB.req(DB.st('recs','readwrite').put(r)); DB.mem.recs.set(r.id, r); },
  async delRec(id){ if(DB.db) return DB.req(DB.st('recs','readwrite').delete(id)); DB.mem.recs.delete(id); },
  async putPhoto(id, b){ if(DB.db) return DB.req(DB.st('photos','readwrite').put(b, id)); DB.mem.photos.set(id, b); },
  async getPhoto(id){ return DB.db ? DB.req(DB.st('photos').get(id)) : DB.mem.photos.get(id); },
  async delPhoto(id){ URLS.delete(id); if(DB.db) return DB.req(DB.st('photos','readwrite').delete(id)); DB.mem.photos.delete(id); },
  async allSites(){ return DB.db ? DB.req(DB.st('sites').getAll()) : [...DB.mem.sites.values()]; },
  async putSite(x){ if(DB.db) return DB.req(DB.st('sites','readwrite').put(x)); DB.mem.sites.set(x.id, x); },
  async delSite(id){ if(DB.db) return DB.req(DB.st('sites','readwrite').delete(id)); DB.mem.sites.delete(id); },
};
const URLS = new Map();
async function photoURL(id){
  if(URLS.has(id)) return URLS.get(id);
  try { const b = await DB.getPhoto(id); if(!b) return null; const u = URL.createObjectURL(b); URLS.set(id, u); return u; } catch(_){ return null; }
}
function hydrate(root){
  for(const img of root.querySelectorAll('img[data-photo]')){
    photoURL(img.dataset.photo).then(u => { if(u) img.src = u; else img.remove(); });
  }
}

/* ---------------- state ---------------- */
const S = { recs: [], cats: new Set(CATS.map(c => c.id)), selId: null, selDay: null, panel: null, draft: null,
  placing: null, pick: null, is3D: true, sat: false, mapReady: false, me: null, terrain: true, hasDem: false };
try { if(localStorage.getItem('dapsa3d.terrain') === '0') S.terrain = false; S.listMode = localStorage.getItem('dapsa3d.listMode') || 'date'; S.cfocus = localStorage.getItem('dapsa3d.cfocus') === '1'; } catch(_){}
const panel = $('#panel');
function visible(){ return S.recs.filter(r => S.cats.has(CAT[r.cat] ? r.cat : 'etc') && (!S.project || r.project === S.project)); }
async function reload(){ S.recs = (await DB.allRecs()).filter(r => r && r.id); renderAll(); }
function renderStat(){
  const days = new Set(S.recs.map(r => r.date).filter(Boolean)).size;
  const obs = S.recs.filter(r => r.type === 'obs').length;
  $('#stat').textContent = `${S.project ? S.project + ' · ' : ''}기록 ${S.recs.length - obs}곳${obs ? ` · 관찰 ${obs}` : ''} · 답사 ${days}일`;
}
function renderAll(){ renderStat(); renderMap(); if(S.panel === 'detail') renderDetail(); if(S.panel === 'list') renderList(); if(S.panel === 'studio') keepScroll(renderStudio); }

/* ---------------- map ---------------- */
let map, SRC = null, FIRST_SYM;
const MK = new Map();
const FC = f => ({type:'FeatureCollection', features: f || []});
function setData(id, feats){ if(!S.mapReady) return; const s = map.getSource(id); if(s) s.setData(FC(feats)); }
const catColor = c => cssVar(`--c-${CAT[c] ? c : 'etc'}`) || '#888';

async function initMap(){
  let style = STYLE_LIGHT;
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  for(const u of dark ? [STYLE_DARK, STYLE_LIGHT] : [STYLE_LIGHT]){
    try { const r = await fetch(u); if(r.ok){ style = await r.json(); break; } } catch(_){ }
  }
  if(typeof style === 'string'){ $('#offline').hidden = false; }
  map = new maplibregl.Map({
    container: 'map', style, center: BUSAN, zoom: 11.5, pitch: 0, bearing: 0, maxPitch: 78,
    attributionControl: {compact: true},
    localIdeographFontFamily: "'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif",
  });
  map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), 'top-right');
  map.on('load', setupLayers);
  map.on('error', e => {
    if(!S.mapReady && e && e.error && /style/i.test(String(e.error.message||'')) && !/layers\./.test(String(e.error.message||''))) $('#offline').hidden = false;
    if(e && e.sourceId === 'sat' && satIsVw){ S.satErr = (S.satErr || 0) + 1; if(S.satErr === 4){ S.vwSatBroken = true; vwSatSync(); toast('브이월드 항공사진을 불러오지 못해 기본 위성 사진으로 바꿨어요', 4500); } }
    if(e && ['contours','dem','dem-hs'].includes(e.sourceId)){ S.demErrs = (S.demErrs || 0) + 1; if(S.demErrs === 3) toast('지형·등고선 자료 일부를 불러오지 못했어요 · 인터넷 연결을 확인해 주세요', 5000); }
  });
  map.on('zoom', onZoom);
  map.on('moveend', scheduleCrumb);
  map.on('moveend', scheduleVw);
  map.on('click', onMapClick);
  map.on('dragstart', () => stopOrbit());
}
function onZoom(){ updateCint(); const z = map.getZoom(); document.body.classList.toggle('z-lbl', z >= 14); $('#zhint').hidden = !(z < 13.6 && S.is3D) || !S.mapReady; }
function setupLayers(){
  const st = map.getStyle();
  S.baseLayerIds = (st.layers || []).map(l => l.id);
  const vec = Object.entries(st.sources || {}).find(([, v]) => v.type === 'vector');
  SRC = vec ? vec[0] : null;
  const fs = st.layers.find(l => l.type === 'symbol'); FIRST_SYM = fs ? fs.id : undefined;
  for(const l of st.layers){
    try {
      if(l['source-layer'] === 'building') map.setLayoutProperty(l.id, 'visibility', 'none');
      const tf = l.type === 'symbol' && l.layout && l.layout['text-field'];
      if(tf){ const j = JSON.stringify(tf); if(j.includes('name') && !/housenumber|"ref"|\{ref\}/.test(j)) map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get','name:ko'], ['get','name'], ['get','name:latin'], '']); }
    } catch(_){}
  }
  map.addSource('sat', {type:'raster', tiles:[SAT_TILES], tileSize:256, maxzoom:19, attribution:'위성 © Esri, Maxar, Earthstar Geographics'});
  map.addLayer({id:'sat', type:'raster', source:'sat', layout:{visibility:'none'}}, FIRST_SYM);
  setupTerrain(st);
  map.addSource('routes', {type:'geojson', data: FC()});
  map.addLayer({id:'routes', type:'line', source:'routes', filter:['!=', ['get','on'], true], layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color': cssVar('--ink-2'), 'line-width': 2, 'line-dasharray':[2, 2], 'line-opacity': 0.75}}, FIRST_SYM);
  map.addLayer({id:'routes-on', type:'line', source:'routes', filter:['==', ['get','on'], true], layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color': cssVar('--accent'), 'line-width': 4.5}}, FIRST_SYM);
  if(SRC){
    map.addLayer({id:'bldg3d', type:'fill-extrusion', source:SRC, 'source-layer':'building', minzoom:13.5,
      paint:{
        'fill-extrusion-color': cssVar('--bldg'),
        'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 13.5, 0, 14.6, ['coalesce', ['feature-state','h'], ['get','render_height'], 6]],
        'fill-extrusion-base': ['coalesce', ['get','render_min_height'], 0],
        'fill-extrusion-opacity': 0.9,
      }}, FIRST_SYM);
    if(!map.getLayer('bldg3d')) map.addLayer({id:'bldg3d', type:'fill-extrusion', source:SRC, 'source-layer':'building', minzoom:13.5, // fallback without corrections
      paint:{'fill-extrusion-color': cssVar('--bldg'), 'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 13.5, 0, 14.6, ['coalesce', ['get','render_height'], 6]], 'fill-extrusion-base': ['coalesce', ['get','render_min_height'], 0], 'fill-extrusion-opacity': 0.9}}, FIRST_SYM);
  }
  const underB = map.getLayer('bldg3d') ? 'bldg3d' : FIRST_SYM;
  if(SRC) for(const sl of ['landcover', 'landuse', 'park']) map.addLayer({id:'q-' + sl, type:'fill', source:SRC, 'source-layer': sl, minzoom: 11, paint:{'fill-opacity': 0}}, 'sat');
  map.addSource('sites', {type:'geojson', data: FC()});
  map.addLayer({id:'sites-fill', type:'fill', source:'sites', paint:{'fill-color':['get','color'], 'fill-opacity':['case', ['to-boolean', ['get','sel']], 0.34, 0.2]}}, underB);
  map.addLayer({id:'sites-line', type:'line', source:'sites', filter:['==', ['get','kind'], 'land'], layout:{'line-join':'round'}, paint:{'line-color':['get','color'], 'line-width':['case', ['to-boolean', ['get','sel']], 3, 1.8]}}, underB);
  map.addLayer({id:'sites-line-area', type:'line', source:'sites', filter:['==', ['get','kind'], 'area'], layout:{'line-join':'round'}, paint:{'line-color':['get','color'], 'line-width':['case', ['to-boolean', ['get','sel']], 3, 1.8], 'line-dasharray':[2, 1.4]}}, underB);
  map.addSource('visited', {type:'geojson', data: FC()});
  map.addLayer({id:'visited', type:'fill-extrusion', source:'visited', paint:{'fill-extrusion-color':['get','color'], 'fill-extrusion-height':['interpolate', ['linear'], ['zoom'], 13.5, 0, 14.6, ['get','h']], 'fill-extrusion-base':['get','b'], 'fill-extrusion-opacity':0.95}}, FIRST_SYM);
  setupAdmin(st);
  setupVwLayers(underB);
  setupStudioLayers(underB);
  setupDraftLayers(underB);
  map.addSource('picked', {type:'geojson', data: FC()});
  map.addSource('drawpts', {type:'geojson', data: FC()});
  map.addLayer({id:'picked-fill', type:'fill', source:'picked', filter:['in', ['get','kind'], ['literal', ['land', 'area']]], paint:{'fill-color': cssVar('--accent'), 'fill-opacity': 0.26}}, map.getLayer('bldg3d') ? 'bldg3d' : FIRST_SYM);
  map.addLayer({id:'picked-line', type:'line', source:'picked', filter:['in', ['get','kind'], ['literal', ['land', 'area', 'line']]], layout:{'line-join':'round', 'line-cap':'round'}, paint:{'line-color': cssVar('--accent'), 'line-width': 2.6}});
  map.addLayer({id:'drawpts', type:'circle', source:'drawpts', paint:{'circle-radius':['case', ['to-boolean', ['get','first']], 7, 5], 'circle-color': cssVar('--sheet'), 'circle-stroke-color': cssVar('--accent'), 'circle-stroke-width': 2.4}});
  map.addLayer({id:'picked', type:'fill-extrusion', source:'picked', filter:['==', ['get','kind'], 'building'], paint:{'fill-extrusion-color': cssVar('--accent'), 'fill-extrusion-height':['get','h'], 'fill-extrusion-base':['get','b'], 'fill-extrusion-opacity':0.92}}, FIRST_SYM);
  S.mapReady = true;
  osmApplyFixes();
  if(S.cfocus) setContourFocus(true);
  renderStudioMap();
  onZoom(); renderMap(); scheduleCrumb();
  if(!S.didFit){ S.didFit = true; fitAll(false); }
}
function setupTerrain(st){
  try {
    let demTiles = DEM_URL, contourTiles = null;
    if(window.mlcontour){
      try {
        const ds = new mlcontour.DemSource({url: DEM_URL, encoding: 'terrarium', maxzoom: 14, worker: true, cacheSize: 120, timeoutMs: 15000});
        ds.setupMaplibre(maplibregl);
        demTiles = ds.sharedDemProtocolUrl;
        contourTiles = ds.contourProtocolUrl({
          multiplier: 1,
          thresholds: {11: [100, 500], 12: [50, 250], 13: [20, 100], 14: [10, 50], 15: [5, 25]},
          contourLayer: 'contours', elevationKey: 'ele', levelKey: 'level', extent: 4096, buffer: 1,
        });
      } catch(_){ demTiles = DEM_URL; contourTiles = null; }
    }
    setupDtm();

const SHORT = {'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원도':'강원','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','전라북도':'전북','전북특별자치도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};

async function reverseGeo(lat, lng){
  if(VW.key && VW.ok !== false){ const v = await vwReverse(lat, lng); if(v) return v; }
  try {
    const r = await fetch(`${NOMI}/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=ko`);
    if(!r.ok) return null; const j = await r.json(); const a = j.address || {};
    const metro = /(특별시|광역시|특별자치시)$/.test(a.city || '');

async function updateCrumb(){

    const seq = ++CRUMB.seq;
    const v = await vwReverse(c.lat, c.lng);
    if(seq !== CRUMB.seq) return;
    if(v && v.parts.length){ parts = z < 13 ? v.parts.slice(0, 2) : v.parts; CRUMB.cache.set(key, parts); }
  }

function jsonp(url, params, timeout = 15000){

async function readExif(file){
  try {
    const v = new DataView(await file.slice(0, 512*1024).arrayBuffer());
    if(v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while(o + 10 < v.byteLength){
      const mk = v.getUint16(o); if((mk & 0xFF00) !== 0xFF00) break;
      const len = v.getUint16(o+2);

      if(mk === 0xFFDA) break;

}

  const ascii = en => { const p = at(en); let s=''; for(let i=0;i<en.count;i++){ const c=v.getUint8(p+i); if(!c) break; s += String.fromCharCode(c); } return s; };

      const g = ifd(u32(ifd0[0x8825].vo));

      if(g[2] && g[4]){ let lat = dms(g[2]), lng = dms(g[4]); if(g[1] && ch(g[1]) === 'S') lat = -lat; if(g[3] && ch(g[3]) === 'W') lng = -lng;

    }
  } catch(_){}

const head = (kicker) => `<div class="grab"></div><div class="p-head"><div class="p-kicker">${kicker}</div><button class="x" data-act="close" aria-label="닫기">×</button></div>`;

function selectRec(id){
  const r = S.recs.find(x => x.id === id); if(!r) return;
  stopOrbit();
  S.selId = id; S.selDay = r.date || null;
  openPanel('detail'); renderMap();
  const shp = shapeOf(r);
  if(shp && shp.kind !== 'building'){
    const wide = window.innerWidth >= 900;
    map.fitBounds(shapeBounds(shp), {padding: wide ? {top:80, bottom:80, left:60, right:460} : {top:70, bottom: Math.round(window.innerHeight*0.5), left:30, right:30}, maxZoom: 18, pitch: S.is3D ? 45 : 0, duration: 700});
  } else if(hasLoc(r)){
    const off = window.innerWidth >= 900 ? [-200, 0] : [0, -Math.round(window.innerHeight*0.22)];
    map.easeTo({center:[r.lng, r.lat], zoom: Math.max(map.getZoom(), 16.3), pitch: S.is3D ? 55 : 0, offset: off, duration: 700});
  }
}

function showErr(msg){ const el = $('#ferr'); if(el){ el.textContent = msg; el.hidden = !msg; if(msg) el.scrollIntoView({block:'nearest'}); } }
async function saveDraft(){
  const d = S.draft;
  if(d.type === 'obs' && !d.name.trim()) d.name = `${d.obs.who} ${d.obs.n > 1 ? d.obs.n + '명 ' : ''}${d.obs.acts[0] || '관찰'}`;
  if(!d.name.trim()) return showErr('장소 이름을 적어 주세요.');
  if(!hasLoc(d)) return showErr('위치를 정해 주세요. "지도에서 건물 고르기"를 누르고 건물을 탭하면 돼요.');
  if(d.uploading) return showErr('사진을 저장하는 중이에요. 잠시만 기다려 주세요.');
  const prev = d.id && S.recs.find(r => r.id === d.id);
  const rec = {
    id: d.id || newId(), name: d.name.trim(), cat: d.cat, date: d.date || '', time: d.time || '',
    lat: +(+d.lat).toFixed(6), lng: +(+d.lng).toFixed(6), bld: d.bld || null, shape: d.shape || null,
    elev: Number.isFinite(d.elev) ? d.elev : (prev && Number.isFinite(prev.elev) && hav(prev, d) < 30 ? prev.elev : elevAt(+d.lng, +d.lat)),
    region: String(d.region||'').trim(), dong: String(d.dong||'').trim(), zoning: String(d.zoning||'').trim(), address: String(d.address||'').trim(), architect: String(d.architect||'').trim(), year: String(d.year||'').trim(), use: String(d.use||'').trim(), material: String(d.material||'').trim(),
    rating: d.rating || 0, memo: d.memo || '', tags: String(d.tags||'').split(/[,#\n]+/).map(s => s.trim()).filter(Boolean).slice(0, 20),
    photos: d.photos.map(p => { const o = {id: p.id}; if(Number.isFinite(p.dir)) o.dir = p.dir; if(Number.isFinite(p.lat)){ o.lat = p.lat; o.lng = p.lng; } return o; }), example: false,
    project: String(d.project || '').trim(), type: d.type === 'obs' ? 'obs' : 'place',
    obs: d.type === 'obs' ? {who: d.obs.who, n: Math.max(1, +d.obs.n || 1), acts: d.obs.acts.slice(), dur: d.obs.dur === '' || d.obs.dur == null ? null : Math.max(0, +d.obs.dur || 0), extra: String(d.obs.extra || '').trim()} : null,
    path: d.type === 'obs' && Array.isArray(d.path) && d.path.length >= 2 ? d.path : null,
    createdAt: prev ? (prev.createdAt || Date.now()) : Date.now(), updatedAt: Date.now(),
  };
  try {
    await DB.putRec(rec);
    for(const pid of d.removed){ try { await DB.delPhoto(pid); } catch(_){} }
    S.draft = null; S.selId = rec.id; S.selDay = rec.date || null;
    await reload(); openPanel('detail');
    toast(prev ? '수정했어요' : '기록했어요');
  } catch(_){ showErr('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.'); }
}
async function cancelEdit(){
  const d = S.draft;
  if(d) for(const id of d.uploaded){ try { await DB.delPhoto(id); } catch(_){} }
  S.draft = null;
  if(d && d.id && S.recs.some(r => r.id === d.id)){ S.selId = d.id; openPanel('detail'); } else closePanel();
}
async function deleteRec(id){
  const r = S.recs.find(x => x.id === id); if(!r) return;
  await DB.delRec(id);
  for(const p of r.photos||[]){ try { await DB.delPhoto(p.id); } catch(_){} }
  S.selId = null; S.selDay = null; closePanel(); await reload(); toast('기록을 삭제했어요');
}

async function importData(file){

  toast('가져오는 중…', 10000);

  for(const raw of j.records){
    if(!raw || !raw.id || !raw.name) continue;

    const keepO = []; for(const o of x.objects){ if(!o.blobId || await DB.getPhoto(o.blobId)){ keepO.push(o); continue; } const du = j.photos && j.photos[o.blobId]; if(typeof du === 'string' && du.startsWith('data:')){ try { await DB.putPhoto(o.blobId, await (await fetch(du)).blob()); keepO.push(o); } catch(_){ nophoto++; } } else nophoto++; }

}

  const az = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi)) + Math.PI;

function poiCat(t){

function snapRings(ll){

function snapEvent(e){

    ${objs.map(row).join('') || '<p class="hint">평면을 길이·각도로 정확히 그리거나, 캐드 DXF·도면 이미지를 깔고, 라이노·스케치업·블렌더에서 내보낸 GLB·OBJ 모델을 대지 위에 세워 볼 수 있어요.</p>'}
    <div class="menu-list row"><button class="btn sm pri" data-act="drawNew">도면 그리기</button><button class="btn sm" data-act="modelUp">3D 모델 올리기</button><button class="btn sm" data-act="planUp">도면 파일 (DXF·이미지)</button></div>
    <label class="tgl"><input type="checkbox" data-act2="hideEx" ${S.hideEx ? 'checked' : ''}> 대지 안 기존 건물 숨기기</label>
    <p class="hint">모델은 GLB 한 파일이 가장 잘 맞아요(OBJ도 돼요). 발밑의 가장 낮은 땅에 세우고, 건폐율·용적률·그림자·단면·내보내기에 함께 들어가요. 면적은 지붕 평면(건축면적)과 층마다 높이 3/4 지점을 자른 단면(바닥면적, 외벽 바깥면 기준)으로 계산해요. 파일은 이 기기에만 저장돼요.</p>
  </section>`;
}

/* ---------- import / export sanitising ---------- */
function cleanLine8(a, max = 400){ if(!Array.isArray(a)) return null; const l = a.filter(c => Array.isArray(c) && c.length >= 2 && Number.isFinite(+c[0]) && Number.isFinite(+c[1])).slice(0, max).map(c => [+(+c[0]).toFixed(8), +(+c[1]).toFixed(8)]); return l.length >= 2 ? l : null; }
function cleanObj(o){
  if(!o || !o.id || !['draw', 'dxf', 'image', 'model'].includes(o.kind)) return null;
  const s2 = v => String(v ?? '').slice(0, 120), num = (v, a, b, d) => { v = +v; return Number.isFinite(v) ? Math.max(a, Math.min(b, v)) : d; };
  const base = {id: s2(o.id), kind: o.kind, name: s2(o.name).slice(0, 40), hidden: !!o.hidden, createdAt: +o.createdAt || Date.now()};
  const pos = () => { const lng = +o.lng, lat = +o.lat; return Number.isFinite(lng) && Number.isFinite(lat) && Math.abs(lat) < 90 ? {lng, lat} : null; };
  if(o.kind === 'draw'){ const coords = cleanLine8(o.coords); return coords ? {...base, coords, closed: !!o.closed && coords.length >= 3} : null; }
  const p = pos(); if(!p) return null;
  if(o.kind === 'dxf'){ let total = 0; const lines = []; for(const l of Array.isArray(o.lines) ? o.lines : []){ const c = Array.isArray(l) ? l.filter(q => Array.isArray(q) && Number.isFinite(+q[0]) && Number.isFinite(+q[1])).map(q => [+q[0], +q[1]]) : []; if(c.length < 2) continue; total += c.length; if(total > 80000) break; lines.push(c); }
    return lines.length ? {...base, ...p, lines, georef: !!o.georef, rot: num(o.rot, -180, 180, 0), scale: num(o.scale, 0.001, 1000, 1), unit: num(o.unit, 0.0001, 10, 1)} : null; }
  const blobId = s2(o.blobId); if(!blobId) return null;
  if(o.kind === 'image') return {...base, ...p, blobId, ar: num(o.ar, 0.01, 100, 1), w: num(o.w, 0.5, 5000, 50), rot: num(o.rot, -180, 180, 0), opacity: num(o.opacity, 0.05, 1, 0.7)};
  return {...base, ...p, blobId, ftype: o.ftype === 'obj' ? 'obj' : 'glb', unit: num(o.unit, 0.0001, 10, 1), scale: num(o.scale, 0.001, 1000, 1), rot: num(o.rot, -180, 180, 0), base: num(o.base, -30, 200, 0), zup: !!o.zup, anchor: o.anchor === 'center' ? 'center' : 'min', floors: o.floors == null ? null : Math.round(num(o.floors, 1, 120, 1))};
}

/* ---------- building heights: storey height by use, OSM fallback, my own corrections ---------- */
const USE_FH = {'01': [3.0, '단독주택'], '02': [2.9, '공동주택'], '03': [3.6, '근린생활시설'], '04': [3.6, '근린생활시설'], '05': [5.0, '문화·집회'], '06': [5.0, '종교'], '07': [4.5, '판매'], '08': [4.5, '운수'], '09': [3.9, '의료'], '10': [3.8, '교육연구'], '11': [3.5, '노유자'], '12': [3.6, '수련'], '13': [6.0, '운동'], '14': [3.8, '업무'], '15': [3.2, '숙박'], '16': [3.6, '위락'], '17': [6.0, '공장'], '18': [6.0, '창고']};
function useInfo(code){ const c0 = String(code ?? '').trim(); if(!/^\d{4,5}$/.test(c0)) return {fh: 3.3, name: ''}; const u = USE_FH[c0.padStart(5, '0').slice(0, 2)]; return u ? {fh: u[0], name: u[1]} : {fh: 3.3, name: ''}; }
const VWI = new Map(), VWI_S = 0.002; // grid index over the national buildings
function vwIdxAdd(k, v){ const rs = vwOuterRings(v.geom); if(!rs.length) return; const bb = ringsBBox(rs); v.bb = bb;
  for(let i = Math.floor(bb[0]/VWI_S); i <= Math.floor(bb[2]/VWI_S); i++) for(let j = Math.floor(bb[1]/VWI_S); j <= Math.floor(bb[3]/VWI_S); j++){ const key = i + ':' + j; let l = VWI.get(key); if(!l){ l = []; VWI.set(key, l); } if(!l.includes(k)) l.push(k); } }
function vwBldgAt(lng, lat){ const l = VWI.get(Math.floor(lng/VWI_S) + ':' + Math.floor(lat/VWI_S)); if(!l) return null;
  for(const k of l){ const v = VW.bldg.get(k); if(!v || !v.bb || lng < v.bb[0] || lng > v.bb[2] || lat < v.bb[1] || lat > v.bb[3]) continue; if(vwOuterRings(v.geom).some(r => inRing([lng, lat], r))) return {k, v}; }
  return null; }
const vwBldgFeatures = () => [...VW.bldg].map(([k, v]) => ({type:'Feature', properties:{k, h: v.h}, geometry: v.geom}));
function innerPoint(ring){ // a point surely inside the footprint (the centroid of an L or U shape can fall outside)
  const c = centroid(ring); if(inRing(c, ring)) return c;
  const y = c[1], xs = []; for(let i = 1; i < ring.length; i++){ const [x1, y1] = ring[i-1], [x2, y2] = ring[i]; if((y1 <= y) !== (y2 <= y)) xs.push(x1 + (y - y1)*(x2 - x1)/(y2 - y1)); }
  xs.sort((a, b) => a - b); let best = null, bw = -1; for(let i = 0; i + 1 < xs.length; i += 2) if(xs[i+1] - xs[i] > bw){ bw = xs[i+1] - xs[i]; best = [(xs[i] + xs[i+1])/2, y]; }
  return best || c; }
function vwFillMissing(){ // national data without a storey count → borrow the OpenStreetMap height when it has one
  if(!SRC) return; const todo = []; for(const v of VW.bldg.values()) if(v.baseSrc === 'none' && !v.osmTried) todo.push(v); if(!todo.length) return;
  let feats = []; try { feats = map.querySourceFeatures(SRC, {sourceLayer:'building'}); } catch(_){} if(!feats.length) return;
  const osm = []; for(const f of feats){ const rh = +(f.properties && f.properties.render_height); if(!Number.isFinite(rh) || rh === 5 || rh < 2) continue; const r = largestRing(f.geometry); if(r) osm.push({r, bb: ringsBBox([r]), h: rh, a: ringAreaM2(r)}); }
  for(const v of todo){ v.osmTried = true; const r = largestRing(v.geom); if(!r) continue; const p = innerPoint(r); let best = null;
    for(const o of osm) if(p[0] >= o.bb[0] && p[0] <= o.bb[2] && p[1] >= o.bb[1] && p[1] <= o.bb[3] && inRing(p, o.r) && (!best || o.a > best.a)) best = o;
    if(best){ v.base = v.h = Math.max(3, best.h); v.baseSrc = v.src = 'osm'; } }
}
const HFIX = {list: [], osm: new Map(), applied: new Set()};
try { const a = JSON.parse(localStorage.getItem('dapsa3d.hfix') || '[]'); if(Array.isArray(a)) HFIX.list = a.filter(f => f && Number.isFinite(+f.lng) && Number.isFinite(+f.lat) && +f.h >= 2).slice(0, 3000); } catch(_){}
HFIX.osm = new Map(HFIX.list.filter(f => f.osm != null).map(f => [f.osm, +f.h]));
function hfixSave(){ try { localStorage.setItem('dapsa3d.hfix', JSON.stringify(HFIX.list)); } catch(_){} }
function vwApplyFixes(){
  for(const v of VW.bldg.values()) if(v.src === 'fix'){ v.h = v.base; v.src = v.baseSrc; v.fix = null; }
  for(const f of HFIX.list){ const m = vwBldgAt(+f.lng, +f.lat); if(m){ m.v.h = +f.h; m.v.src = 'fix'; m.v.fix = f; } }
}
function osmApplyFixes(){
  HFIX.osm = new Map(HFIX.list.filter(f => f.osm != null).map(f => [f.osm, +f.h]));
  if(!S.mapReady || !SRC) return;
  for(const id of [...HFIX.applied]) if(!HFIX.osm.has(id)){ try { map.removeFeatureState({source: SRC, sourceLayer:'building', id}, 'h'); } catch(_){} HFIX.applied.delete(id); }
  for(const [id, h] of HFIX.osm){ try { map.setFeatureState({source: SRC, sourceLayer:'building', id}, {h}); HFIX.applied.add(id); } catch(_){} }
}
const osmH = f => { const fx = f.id != null ? HFIX.osm.get(f.id) : null; return fx || Math.max(3, +(f.properties && f.properties.render_height) || 6); };
function applyHfix(){ vwApplyFixes(); if(S.mapReady){ setData('vw-bldg', vwBldgFeatures()); osmApplyFixes(); } SUNCTX = null; renderMap(); }
function hfixPut(f, hb){ HFIX.list = HFIX.list.filter(x => !inRing([+x.lng, +x.lat], hb.ring) && !(hb.oid != null && x.osm === hb.oid)); if(f) HFIX.list.push(f); hfixSave(); applyHfix(); }
function liveBld(p){ // a recorded building drawn over the live one, so the two never disagree
  const ip = innerPoint(p.ring);
  if(VW.key && VW.ok !== false && VW.on.bldg){ const m = vwBldgAt(ip[0], ip[1]); if(m){ const r = largestRing(m.v.geom); if(r) return {ring: r, h: m.v.h}; } }
  const fx = HFIX.list.find(f => inRing([+f.lng, +f.lat], p.ring));
  return {ring: p.ring, h: fx ? +fx.h : (+p.h || 8)};
}
$('#hfFl').addEventListener('input', () => { const P = S.placing, hb = P && P._hf, n = parseInt($('#hfFl').value, 10); if(hb && n > 0) $('#hfH').value = (n*(hb.fh || 3.3)).toFixed(1); });
for(const id of ['#hfFl', '#hfH']) $(id).addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); $('#hfSave').click(); } });
$('#hfSave').onclick = () => {
  const P = S.placing, hb = P && P._hf; if(!hb) return;
  const h = parseFloat($('#hfH').value), fl = parseInt($('#hfFl').value, 10) || null;

  const hv = Math.round(h*10)/10;
  hfixPut({lng: +hb.lng.toFixed(7), lat: +hb.lat.toFixed(7), h: hv, fl, osm: hb.oid, t: Date.now()}, hb);
  const pt = P.hpts[0]; pt.z = pt.z - hb.h + hv; pt.label = `건물 ${hv.toFixed(1)}m`; pt.detail = `건물 높이 ${hv.toFixed(1)}m (내가 고친 높이${fl ? ` · ${fl}층` : ''})`;
  hb.h = hv; hb.floors = fl; hb.src = 'fix';
  renderPlacing(); toast(`이 건물을 ${hv.toFixed(1)}m로 고쳤어요 · 그림자·단면·내보내기에도 반영돼요`, 3600);
};
$('#hfReset').onclick = () => {
  const P = S.placing, hb = P && P._hf; if(!hb) return;
  hfixPut(null, hb); P.hpts = []; P._hf = null; renderPlacing(); toast('원래 높이로 되돌렸어요 · 다시 탭하면 바뀐 높이를 보여 줘요');
